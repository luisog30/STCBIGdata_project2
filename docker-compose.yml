version: '3.8'

services:
  minio:
    image: minio/minio
    container_name: nba_minio
    ports:
      - "9000:9000" 
      - "9001:9001" 
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadmin"
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nba_network

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nba_mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./services/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - nba_network

  redis:
    image: redis:7-alpine
    container_name: nba_redis
    ports:
      - "6379:6379"
    networks:
      - nba_network

  preprocess:
    build: ./services/preprocess
    container_name: nba_preprocess
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TOPIC_RAW: shots/raw
      TOPIC_CLEAN: shots/clean
      MQTT_QOS: 1
    depends_on:
      - mqtt
    restart: unless-stopped
    networks:
      - nba_network

  ingest:
    build: ./services/ingest
    container_name: nba_ingest
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      TOPIC_RAW: shots/raw
      MQTT_QOS: 1
      HF_DATASET: Vladislav/nba_dataset
      HF_SPLIT: train
      HF_STREAMING: "1"
      MAX_EVENTS: 5000
      SLEEP_MS: 0
    depends_on:
      - mqtt
      - preprocess
    networks:
      - nba_network

  xpoints_train:
    build:
      context: ./services/xpoints_model
    container_name: nba_xpoints_train
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: nba-data
      TRAIN_DATA_PATH: processed/clean_data.parquet
      MODEL_OUTPUT_PATH: models/xpoints_model.pkl
    depends_on:
      - minio
    networks:
      - nba_network
    profiles:
      - train

  api_backend:
    build:
      context: ./services/api_backend
    container_name: nba_api_backend
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: nba-data
      DATA_PATH: processed/clean_data.parquet
      MODEL_PATH: models/xpoints_model.pkl
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_SECONDS: 600
    depends_on:
      - minio
      - redis
    ports:
      - "8000:8000"
    networks:
      - nba_network

  dashboard:
    build:
      context: ./services/dashboard
    container_name: nba_dashboard
    environment:
      API_BASE_URL: http://api_backend:8000
      FALLBACK_API_BASE_URL: http://host.docker.internal:8000
      API_REQUEST_RETRIES: 5
      API_REQUEST_RETRY_SLEEP: 1
    depends_on:
      - api_backend
    ports:
      - "8501:8501"
    networks:
      - nba_network

  etl_job:
    build: ./services/etl
    container_name: nba_etl
    environment:
      S3_ENDPOINT: http://minio:9000
      MINIO_USER: minioadmin
      MINIO_PASS: minioadmin
    depends_on:
      - minio
      - mqtt
    networks:
      - nba_network
    profiles:
      - etl

networks:
  nba_network:
    driver: bridge
